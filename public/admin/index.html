<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EvenPlay Admin</title>
<style>
:root { color-scheme: dark; --bg: #0a2a29; --rail: #072120; --ink: #f3efe6; --soft: #b9c9c4; --gold: #f0b43a; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 "Segoe UI", system-ui, sans-serif; }
main { max-width: 900px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 48px; display: grid; gap: 18px; }
h1 { margin: 0; font-size: 30px; }
label { font-weight: 700; display: block; margin-bottom: 6px; }
input { font: 700 18px inherit; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--soft); background: var(--rail); color: var(--ink); width: min(420px, 100%); min-height: 48px; }
button { font: 700 16px inherit; padding: 8px 14px; min-height: 44px; border-radius: 10px; border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
button.danger { border-color: #ff8a80; color: #ff8a80; }
button:focus-visible, input:focus-visible { outline: 4px solid #fff; outline-offset: 2px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.12); }
.muted { color: var(--soft); }
#msg { font-weight: 700; color: var(--gold); min-height: 1.5em; margin: 0; }
.tbl { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1>EvenPlay Admin</h1>
  <p class="muted" style="margin:0">Remove a player from every leaderboard. Removed players stay off the boards, even if they keep playing.</p>
  <form id="login">
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p style="margin:10px 0 0"><button type="submit">Show players</button></p>
  </form>
  <p id="msg" role="status"></p>
  <section id="list" hidden aria-labelledby="list-h">
    <h2 id="list-h">Players on the boards</h2>
    <label for="filter">Search names</label>
    <input id="filter" type="search" autocomplete="off">
    <div class="tbl" style="margin-top:12px"><table><thead><tr><th scope="col">Name</th><th scope="col">Game</th><th scope="col">Against</th><th scope="col">Best</th><th scope="col">Action</th></tr></thead><tbody id="rows"></tbody></table></div>
    <h2>Removed players</h2>
    <ul id="bans"></ul>
  </section>
</main>
<script>
(() => {
  const GAMES = { cc: "Color Clash", lf: "Letter Flip", rm: "Rummy", dr: "Deal Rush", dd: "Dice Dash" };
  const $ = (id) => document.getElementById(id);
  let pw = "", data = null, confirmFor = null;
  async function call(body) {
    const r = await fetch("/api/admin", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: pw, ...body }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || "Something went wrong."); return d;
  }
  async function load() { data = await call({ action: "list" }); draw(); }
  function draw() {
    const q = $("filter").value.trim().toLowerCase();
    const tb = $("rows"); tb.replaceChildren();
    for (const row of data.rows.filter((r) => !q || (r.name || "").toLowerCase().includes(q))) {
      const tr = document.createElement("tr");
      for (const v of [row.name, GAMES[row.game] || row.game, row.mode === "cpu" ? "Computer" : "Players", row.best]) { const td = document.createElement("td"); td.textContent = v; tr.append(td); }
      const td = document.createElement("td");
      const b = document.createElement("button"); b.type = "button"; b.className = "danger";
      b.textContent = confirmFor === row.player ? "Yes, remove " + row.name + " everywhere" : "Remove " + row.name;
      b.addEventListener("click", async () => {
        if (confirmFor !== row.player) { confirmFor = row.player; draw(); $("msg").textContent = "Choose the button again to confirm removing " + row.name + " from every board."; return; }
        try { const d = await call({ action: "remove", player: row.player }); confirmFor = null; $("msg").textContent = "Removed " + row.name + " (" + d.removed + " entries)."; await load(); }
        catch (e) { $("msg").textContent = e.message; }
      });
      td.append(b); tr.append(td); tb.append(tr);
    }
    if (!tb.children.length) { const tr = document.createElement("tr"); const td = document.createElement("td"); td.colSpan = 5; td.className = "muted"; td.textContent = "Nobody matches."; tr.append(td); tb.append(tr); }
    const ul = $("bans"); ul.replaceChildren();
    for (const p of data.bans) {
      const li = document.createElement("li"); li.textContent = "Player code " + p + " ";
      const b = document.createElement("button"); b.type = "button"; b.textContent = "Let them back on";
      b.addEventListener("click", async () => { await call({ action: "unban", player: p }); $("msg").textContent = "Player code " + p + " can appear on the boards again."; await load(); });
      li.append(b); ul.append(li);
    }
    if (!data.bans.length) { const li = document.createElement("li"); li.className = "muted"; li.textContent = "None."; ul.append(li); }
  }
  $("login").addEventListener("submit", async (e) => {
    e.preventDefault(); pw = $("pw").value;
    try { await load(); $("list").hidden = false; $("msg").textContent = data.rows.length + " leaderboard entries."; $("list-h").setAttribute("tabindex", "-1"); $("list-h").focus(); }
    catch (err) { $("msg").textContent = err.message; }
  });
  $("filter").addEventListener("input", draw);
})();
</script>
</body>
</html>
